[project]
name = "imobiliario-pt"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = ["duckdb>=1.0", "pandas>=2.0", "pyarrow>=15", "pyyaml", "requests", "shapely>=2.0"]

[project.optional-dependencies]
dev = ["pytest"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
