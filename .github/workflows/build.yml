name: build-and-deploy

on:
  schedule:
    - cron: "17 6 * * 1"   # segundas, 06:17 UTC: build semanal
    # Tentativas extra (todos os dias): só fazem alguma coisa se o último build não chegou ao INE
    # (o INE recusa às vezes os runners do GitHub). Ver o passo "Decidir se é preciso tentar outra vez".
    - cron: "47 10 * * *"
    - cron: "47 16 * * *"
  workflow_dispatch:
    inputs:
      backtest:
        description: "Também correr o backtest multi-país (site/data/backtest.json)"
        type: boolean
        default: false
  push:
    branches: [main]

permissions:
  contents: write     # para guardar snapshots no branch `data`
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      run: ${{ steps.gate.outputs.run }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Decidir se é preciso tentar outra vez
        id: gate
        env:
          EVENT: ${{ github.event_name }}
          CRON: ${{ github.event.schedule }}
        run: |
          run=true
          if [ "$EVENT" = "schedule" ] && [ "$CRON" != "17 6 * * 1" ]; then
            git fetch origin data || true
            if git show origin/data:data/clean/ine_status.json > /tmp/ine_status.json 2>/dev/null \
               && python3 -c "import json,sys; sys.exit(0 if json.load(open('/tmp/ine_status.json')).get('live') else 1)"; then
              run=false
              echo "o último build já chegou ao INE: nada a repetir"
            else
              echo "o último build não chegou ao INE (ou sem estado): a tentar outra vez"
            fi
          fi
          echo "run=$run" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-python@v5
        if: steps.gate.outputs.run == 'true'
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e ".[dev]"
        if: steps.gate.outputs.run == 'true'
      - run: pytest -q
        if: steps.gate.outputs.run == 'true'
      - name: Restaurar último snapshot (fallback se o INE falhar)
        if: steps.gate.outputs.run == 'true'
        run: |
          # O fallback usa o snapshot MAIS RECENTE entre: data/clean versionado em main (commit manual)
          # e data/clean do branch `data` (último run que alterou dados).
          git fetch origin data || true
          if git rev-parse --verify origin/data >/dev/null 2>&1; then
            t_data=$(git log -1 --format=%ct origin/data -- data/clean)
            t_main=$(git log -1 --format=%ct HEAD -- data/clean)
            if [ ! -d data/clean ] || [ "${t_data:-0}" -gt "${t_main:-0}" ]; then
              echo "fallback: snapshot do branch data (${t_data:-0}) é mais recente que o de main (${t_main:-0})"
              git archive origin/data data/clean | tar -x
            else
              echo "fallback: data/clean de main (${t_main:-0}) é o mais recente"
            fi
          else
            echo "fallback: sem branch data, a usar data/clean de main (se existir)"
          fi
      - name: Restaurar arquivo de previsões (branch data)
        if: steps.gate.outputs.run == 'true'
        # O arquivo só cresce no branch `data`. O passo anterior pode escolher o data/clean de main
        # (se for mais recente) e perder o histórico: por isso é sempre reposto a partir do branch data.
        run: |
          if git cat-file -e origin/data:data/clean/forecast_log.parquet 2>/dev/null; then
            mkdir -p data/clean
            git show origin/data:data/clean/forecast_log.parquet > data/clean/forecast_log.parquet
            echo "forecast_log.parquet restaurado do branch data"
          else
            echo "ainda sem arquivo de previsões (é criado neste build)"
          fi
      - name: Construir dados (INE, BCE, Eurostat, BIS)
        if: steps.gate.outputs.run == 'true'
        env:
          IMOPT_INE_MODE: auto   # o INE pode não aceitar ligações dos runners: usa data/clean
        run: python -m imopt build
      - name: Restaurar backtest.json em cache (se existir)
        if: steps.gate.outputs.run == 'true'
        # site/data/ nunca fica no repositório: cada build parte do zero. Sem isto, um deploy
        # normal (sem a flag abaixo) publicava um site SEM secção de backtest, apagando o
        # resultado do último "Also run the backtest" até alguém voltar a correr manualmente.
        run: |
          if [ -f data/clean/backtest.json ]; then
            mkdir -p site/data
            cp data/clean/backtest.json site/data/backtest.json
            echo "backtest.json restaurado da cache (data/clean)"
          else
            echo "sem cache de backtest.json ainda (corre com a flag 'backtest' pelo menos uma vez)"
          fi
      - name: Backtest multi-país do score nacional (opcional, só quando pedido manualmente)
        # Não corre nas execuções automáticas (agendada/push): ~40 pedidos extra a Eurostat/BIS
        # tornariam o workflow semanal mais lento e frágil. Ver README, secção "Backtest".
        # Atualiza site/data/backtest.json E a cópia em cache (data/clean), para o passo acima
        # continuar a servir este resultado nos deploys seguintes até ser corrido de novo.
        if: steps.gate.outputs.run == 'true' && (github.event_name == 'workflow_dispatch' && github.event.inputs.backtest == 'true')
        continue-on-error: true
        run: |
          python -m imopt backtest
          mkdir -p data/clean
          cp site/data/backtest.json data/clean/backtest.json
      - name: Guardar snapshots no branch data
        if: steps.gate.outputs.run == 'true'
        run: |
          # Trabalha num worktree separado: não mexe no checkout do build (que tem data/ alterado).
          tmp=$(mktemp -d)
          cp -r data "$tmp/newdata"
          git fetch origin data || true
          if git rev-parse --verify origin/data >/dev/null 2>&1; then
            git worktree add "$tmp/wt" origin/data
            cd "$tmp/wt" && git checkout -q -B data
          else
            git worktree add --detach "$tmp/wt" HEAD
            cd "$tmp/wt" && git checkout -q --orphan data && git rm -rfq . || true
          fi
          rm -rf data && cp -r "$tmp/newdata" data
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f data
          git commit -m "snapshot $(date -u +%F)" || echo "sem alterações"
          git push origin data
      - uses: actions/configure-pages@v5
        if: steps.gate.outputs.run == 'true'
      - uses: actions/upload-pages-artifact@v3
        if: steps.gate.outputs.run == 'true'
        with:
          path: site
  deploy:
    needs: build
    if: needs.build.outputs.run == 'true'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
