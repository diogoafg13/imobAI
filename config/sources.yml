# Fontes de dados. Tudo o que muda (códigos, filtros) vive aqui, não no código.
#
# ATENÇÃO: os códigos INE abaixo foram recolhidos de projetos públicos e da
# documentação do INE, mas a estrutura das respostas não foi verificada ao vivo
# no momento da escrita. Corre `python -m imopt inspect <varcd>` para ver as
# dimensões reais de um indicador e ajusta `dims` se necessário.

ine:
  base_url: https://www.ine.pt/ine/json_indicador/pindica.jsp
  lang: PT
  indicators:
    sales_price_12m:
      varcd: "0012234"          # Valor mediano das vendas, últimos 12 meses (Metod. 2022), trimestral
      description: Preço mediano de venda (€/m²), 12 meses, trimestral
      level: municipality       # município (com detalhe até freguesia no INE)
      # dim_3: H1 = Total (confirmado no build real), H11/H12 = restantes categorias.
      dims: {dim_3: "H1"}
      period_kind: quarter
    # Mesmo indicador, outras categorias (o pedido ao INE é feito uma só vez e reutilizado).
    # Categorias confirmadas no snapshot bruto: H11 = Novos (186 concelhos), H12 = Existentes (305).
    sales_price_new:
      varcd: "0012234"
      description: Preço mediano de venda de alojamentos NOVOS (€/m²), 12 meses
      level: municipality
      dims: {dim_3: "H11"}
      period_kind: quarter
      optional: true
    sales_price_existing:
      varcd: "0012234"
      description: Preço mediano de venda de alojamentos EXISTENTES (€/m²), 12 meses
      level: municipality
      dims: {dim_3: "H12"}
      period_kind: quarter
      optional: true
    # Domicílio fiscal do comprador (confirmado com `imopt inspect 0012246`): 1 = Território nacional,
    # 2 = Estrangeiro (21 = UE, 22 = restantes países), T = Total. Freguesia/município, 12 meses, trimestral.
    sales_price_domestic:
      varcd: "0012246"
      description: Preço mediano de venda, compradores com domicílio em Portugal (€/m²)
      level: municipality
      dims: {dim_3: "1"}
      period_kind: quarter
      optional: true
    sales_price_foreign:
      varcd: "0012246"
      description: Preço mediano de venda, compradores com domicílio no estrangeiro (€/m²)
      level: municipality
      dims: {dim_3: "2"}
      period_kind: quarter
      optional: true
    # Setor institucional do comprador (confirmado com `imopt inspect 0012236`): S1400000 = Famílias,
    # S3000000 = Restantes setores institucionais (empresas, bancos, fundos, Estado…), T = Total.
    sales_price_households:
      varcd: "0012236"
      description: Preço mediano de venda, compradores famílias (€/m²)
      level: municipality
      dims: {dim_3: "S1400000"}
      period_kind: quarter
      optional: true
    sales_price_companies:
      varcd: "0012236"
      description: Preço mediano de venda, compradores empresas e outras entidades (€/m²)
      level: municipality
      dims: {dim_3: "S3000000"}
      period_kind: quarter
      optional: true
    # Apartamentos (0012235, sem dimensões extra) e tipologia (0012241: 1 = T0/T1, 2 = T2, 3 = T3, 4 = T4+).
    sales_price_apartments:
      varcd: "0012235"
      description: Preço mediano de venda de apartamentos (€/m²), 12 meses
      level: municipality
      period_kind: quarter
      optional: true
    sales_price_t01:
      varcd: "0012241"
      description: Preço mediano de venda T0/T1 (€/m²)
      level: municipality
      dims: {dim_3: "1"}
      period_kind: quarter
      optional: true
    sales_price_t2:
      varcd: "0012241"
      description: Preço mediano de venda T2 (€/m²)
      level: municipality
      dims: {dim_3: "2"}
      period_kind: quarter
      optional: true
    sales_price_t3:
      varcd: "0012241"
      description: Preço mediano de venda T3 (€/m²)
      level: municipality
      dims: {dim_3: "3"}
      period_kind: quarter
      optional: true
    sales_price_t4:
      varcd: "0012241"
      description: Preço mediano de venda T4 ou mais (€/m²)
      level: municipality
      dims: {dim_3: "4"}
      period_kind: quarter
      optional: true
    # sales_price_annual (0013042): redundante com o indicador de 12 meses acima; desligado.
    sales_price_annual:
      varcd: null
      description: Preço de venda (€/m²) por quartil, anual (desligado)
      level: municipality
      period_kind: year
      optional: true
    rent_new_contracts:
      varcd: "0014711"          # Rendas de novos contratos (Metodologia 2026), anual/quartis
      description: Renda mediana de novos contratos (€/m²/mês)
      level: municipality
      # dim_3 = quartil (1, 2, 3). O 2.º quartil é a mediana.
      dims: {dim_3: "2"}
      period_kind: year
    rent_q1:
      varcd: "0014711"          # 1.º quartil (confirmado no snapshot bruto, 255 concelhos)
      description: Renda de novos contratos, 1.º quartil (€/m²/mês)
      level: municipality
      dims: {dim_3: "1"}
      period_kind: year
      optional: true
    rent_q3:
      varcd: "0014711"          # 3.º quartil
      description: Renda de novos contratos, 3.º quartil (€/m²/mês)
      level: municipality
      dims: {dim_3: "3"}
      period_kind: year
      optional: true
    rent_parish:
      varcd: "0012600"          # Renda mediana de novos contratos por freguesia (Metodologia 2021, €/m²), anual
      description: Renda mediana de novos contratos por freguesia (€/m²)
      level: parish
      period_kind: year
      optional: true
    lic_dwellings:
      # Fogos licenciados em construções novas para habitação familiar (N.º), anual 1995–2025, até à freguesia (geocod
      # de 9 = NUTS III + DICOFRE). Confirmado pela sonda de 7/10/2026: dim_3 tipologia (T = Total, 1 T0/T1, 2 T2, 3 T3,
      # 4 T4+). O 0000088 é o mesmo por tipo de promotor.
      varcd: "0000087"
      description: Fogos licenciados em construções novas para habitação (N.º)
      level: parish
      dims: {dim_3: "T"}
      period_kind: year
      optional: true
    rent_contracts:
      varcd: "0012601"          # Novos contratos de arrendamento (Metodologia 2021 - N.º), anual, até freguesia
      description: Novos contratos de arrendamento (N.º)
      level: municipality
      period_kind: year
      optional: true
    hpi:
      # Índice de Preços da Habitação, base 2025, trimestral, 2009T1+ (0014765; o 0009201, base 2015, parou em
      # 2025T4). Confirmado pela sonda de 6/10/2026: dim_3 H1 = Total, H11 = Novos, H12 = Existentes, só nacional.
      # O painel usa-o só quando falta o HPI do Eurostat, e então repõe-no em 2015 = 100 (pipeline.py).
      varcd: "0014765"
      description: Índice de preços da habitação (nacional)
      level: national
      # dim_3: H1 = Total, H11 = Novos, H12 = Existentes.
      dims: {dim_3: "H1"}
      period_kind: quarter
    bank_valuation:
      varcd: "0012248"          # Avaliação bancária €/m², mensal
      description: Avaliação bancária mediana (€/m²)
      level: municipality
      # dim_3: T = Total, 1 = Apartamentos, 2 = Moradias.
      dims: {dim_3: "T"}
      period_kind: month
      optional: true
    valuation_count:
      varcd: "0012247"          # Avaliações bancárias (N.º) nos últimos 3 meses, município, mensal
      description: Número de avaliações bancárias, últimos 3 meses (volume de compras com crédito)
      level: municipality
      # dim_3: T = Total, 1 = Apartamentos, 2 = Moradias (confirmado com `imopt inspect 0012247`).
      dims: {dim_3: "T"}
      period_kind: month
      optional: true
    valuation_count_apartments:
      varcd: "0012247"
      description: Número de avaliações bancárias de apartamentos, últimos 3 meses
      level: municipality
      dims: {dim_3: "1"}
      period_kind: month
      optional: true
    valuation_count_houses:
      varcd: "0012247"
      description: Número de avaliações bancárias de moradias, últimos 3 meses
      level: municipality
      dims: {dim_3: "2"}
      period_kind: month
      optional: true
    valuation_apartments:
      varcd: "0012248"          # dim_3 = 1 (confirmado no snapshot bruto: 116 concelhos)
      description: Avaliação bancária mediana de APARTAMENTOS (€/m²)
      level: municipality
      dims: {dim_3: "1"}
      period_kind: month
      optional: true
    valuation_houses:
      varcd: "0012248"          # dim_3 = 2 (152 concelhos)
      description: Avaliação bancária mediana de MORADIAS (€/m²)
      level: municipality
      dims: {dim_3: "2"}
      period_kind: month
      optional: true
    # Por preencher (códigos não confirmados). Quando souberes o varcd, define-o
    # e o pipeline passa a usá-lo automaticamente no sub-score de oferta.
    building_permits:
      varcd: null               # Fogos licenciados em construções novas (habitação familiar)
      description: Fogos licenciados em construções novas
      level: municipality
      period_kind: year
      optional: true
    completed_dwellings:
      varcd: null               # Fogos concluídos em construções novas (habitação familiar)
      description: Fogos concluídos em construções novas
      level: municipality
      period_kind: year
      optional: true
    # Oferta, rendimento de quem vive no concelho, parque habitacional, Censos e alojamento turístico.
    # Códigos do catálogo de indicadores principais do INE; dimensões confirmadas no snapshot bruto
    # (data/raw/ine/<varcd>/ no branch data, build de 2026-10-01). NÃO entram em nenhum score (só contexto):
    # os campos building_permits/completed_dwellings acima, que alimentariam o sub-score de oferta,
    # continuam vazios de propósito.
    dwellings_licensed:
      varcd: "0012097"          # Fogos licenciados em construções novas p/ habitação familiar, MENSAL, só até NUTS III
      description: Fogos licenciados em construções novas para habitação familiar (N.º)
      level: national
      # dim_3 = tipologia: T = Total, 1 = T0/T1, 2 = T2, 3 = T3, 4 = T4+.
      dims: {dim_3: "T"}
      optional: true
    dwellings_completed:
      varcd: "0012778"          # Fogos concluídos em construções novas p/ habitação familiar, TRIMESTRAL, só até NUTS II
      description: Fogos concluídos em construções novas para habitação familiar (N.º)
      level: national
      optional: true
    dwellings_stock:
      varcd: "0008329"          # Alojamentos familiares clássicos (parque habitacional), anual 2011–2022, concelho
      description: Alojamentos familiares clássicos, parque habitacional (N.º)
      level: municipality
      optional: true
      # Último ano publicado: 2022 (catálogo completo do INE de 6/10/2026; o código novo 0014137 também acaba em
      # 2022). Não é código mudado: o INE ainda não publicou 2023. Alerta só a partir de 4 anos e meio.
      max_age_months: 54
    # Censos 2021 (0012502): geocod de 4 dígitos = concelho (DICO), 6 = freguesia. dim_3 = forma de ocupação
    # (1 habitual, 2 secundária, 3 vago para venda/arrendamento, 4 vago por outros motivos, T total);
    # dim_4 = tipo de edifício, dim_5 = n.º de alojamentos no edifício (ambos T = Total).
    census_total:
      varcd: "0012502"
      description: Alojamentos familiares clássicos, Censos 2021 (N.º)
      level: municipality
      dims: {dim_3: "T", dim_4: "T", dim_5: "T"}
      optional: true
      static: true            # Censos 2021: só muda com o próximo censo (sem alerta de série parada)
    # Censos 2021, edifícios por época de construção (dim_3: 01 antes de 1919, 02 1919–1945, 03 1946–1960, … T) e
    # necessidade de reparação (dim_4: 4 sem, 1 ligeiras, 2 médias, 3 profundas, T), por freguesia (CAOP de 2013, as
    # mesmas do resto da tabela). 0012578, confirmado pela sonda de 6/10/2026 (data/clean/ine_probe.json).
    census_bld_total:
      varcd: "0012578"
      description: Edifícios, Censos 2021 (N.º)
      level: municipality
      dims: {dim_3: "T", dim_4: "T"}
      optional: true
      static: true
    census_bld_pre1919:
      varcd: "0012578"
      description: Edifícios construídos antes de 1919, Censos 2021 (N.º)
      level: municipality
      dims: {dim_3: "01", dim_4: "T"}
      optional: true
      static: true
    census_bld_1919_1945:
      varcd: "0012578"
      description: Edifícios construídos em 1919–1945, Censos 2021 (N.º)
      level: municipality
      dims: {dim_3: "02", dim_4: "T"}
      optional: true
      static: true
    census_bld_1946_1960:
      varcd: "0012578"
      description: Edifícios construídos em 1946–1960, Censos 2021 (N.º)
      level: municipality
      dims: {dim_3: "03", dim_4: "T"}
      optional: true
      static: true
    census_bld_repair_mid:
      varcd: "0012578"
      description: Edifícios com necessidades médias de reparação, Censos 2021 (N.º)
      level: municipality
      dims: {dim_3: "T", dim_4: "2"}
      optional: true
      static: true
    census_bld_repair_deep:
      varcd: "0012578"
      description: Edifícios com necessidades profundas de reparação, Censos 2021 (N.º)
      level: municipality
      dims: {dim_3: "T", dim_4: "3"}
      optional: true
      static: true
    census_secondary:
      varcd: "0012502"
      description: Alojamentos de residência secundária, Censos 2021 (N.º)
      level: municipality
      dims: {dim_3: "2", dim_4: "T", dim_5: "T"}
      optional: true
      static: true            # Censos 2021: só muda com o próximo censo (sem alerta de série parada)
    census_vacant_market:
      varcd: "0012502"
      description: Alojamentos vagos para venda ou arrendamento, Censos 2021 (N.º)
      level: municipality
      dims: {dim_3: "3", dim_4: "T", dim_5: "T"}
      optional: true
      static: true            # Censos 2021: só muda com o próximo censo (sem alerta de série parada)
    census_vacant_other:
      varcd: "0012502"
      description: Alojamentos vagos por outros motivos, Censos 2021 (N.º)
      level: municipality
      dims: {dim_3: "4", dim_4: "T", dim_5: "T"}
      optional: true
      static: true            # Censos 2021: só muda com o próximo censo (sem alerta de série parada)
    irs_median:
      varcd: "0012757"          # Mediana do rendimento bruto declarado deduzido do IRS liquidado por sujeito passivo (€), anual 2018+
      description: Rendimento declarado mediano após IRS, por sujeito passivo (€/ano)
      level: municipality
      optional: true
    # Capacidade de alojamento turístico (camas), anual 2023+, concelho. dim_3: T = Total, 01 = Hotelaria,
    # 02 = Alojamento local, 03 = Turismo no espaço rural e de habitação (e subcategorias da hotelaria).
    tourism_beds:
      varcd: "0013366"
      description: Capacidade de alojamento turístico, total (camas)
      level: municipality
      dims: {dim_3: "T"}
      optional: true
    tourism_beds_al:
      varcd: "0013366"
      description: Capacidade de alojamento turístico, alojamento local (camas)
      level: municipality
      dims: {dim_3: "02"}
      optional: true
    # Licenças por tipologia (mesmo pedido que dwellings_licensed; só nacional/regiões): 1 = T0/T1, 2 = T2, 3 = T3, 4 = T4+.
    dwellings_licensed_t01:
      varcd: "0012097"
      description: Fogos licenciados T0/T1 (N.º)
      level: national
      dims: {dim_3: "1"}
      optional: true
    dwellings_licensed_t2:
      varcd: "0012097"
      description: Fogos licenciados T2 (N.º)
      level: national
      dims: {dim_3: "2"}
      optional: true
    dwellings_licensed_t3:
      varcd: "0012097"
      description: Fogos licenciados T3 (N.º)
      level: national
      dims: {dim_3: "3"}
      optional: true
    dwellings_licensed_t4:
      varcd: "0012097"
      description: Fogos licenciados T4 ou mais (N.º)
      level: national
      dims: {dim_3: "4"}
      optional: true
    # Turismo (dimensões confirmadas no snapshot bruto): dim_3 T = Total, 01 = Hotelaria, 02 = Alojamento local,
    # 03 = Turismo no espaço rural e de habitação (a ocupação tem ainda subcategorias da hotelaria).
    tourism_guests:
      varcd: "0012089"          # Hóspedes (N.º) nos estabelecimentos de alojamento turístico, MENSAL desde 2022, concelho
      description: Hóspedes em alojamento turístico (N.º)
      level: municipality
      dims: {dim_3: "T"}
      optional: true
    tourism_guests_al:
      varcd: "0012089"
      description: Hóspedes em alojamento local (N.º)
      level: municipality
      dims: {dim_3: "02"}
      optional: true
    tourism_occupancy:
      varcd: "0013288"          # Taxa líquida de ocupação-cama (%), anual desde 2022, concelho
      description: Taxa líquida de ocupação-cama (%)
      level: municipality
      dims: {dim_3: "T"}
      optional: true
    # Índice de custo de construção de habitação nova (base 2021), MENSAL desde 2000, só nacional.
    # dim_3 (confirmado no snapshot bruto): T = Total, 1 = Materiais, 2 = Mão de obra.
    construction_cost:
      varcd: "0011748"
      description: Índice de custo de construção de habitação nova, total (2021 = 100)
      level: national
      dims: {dim_3: "T"}
      optional: true
    construction_cost_materials:
      varcd: "0011748"
      description: Índice de custo de construção de habitação nova, materiais (2021 = 100)
      level: national
      dims: {dim_3: "1"}
      optional: true
    construction_cost_labour:
      varcd: "0011748"
      description: Índice de custo de construção de habitação nova, mão de obra (2021 = 100)
      level: national
      dims: {dim_3: "2"}
      optional: true
    # População residente por concelho (estimativas anuais, 2011+). dim_3 = sexo (T = HM), dim_4 = grupo etário
    # (T = todas as idades), confirmado no snapshot bruto. 0004163 só tem país e regiões e 0004350 (subsídio de
    # desemprego) só o total nacional: ficaram de fora.
    population:
      # 0012917: estimativas anuais 2021–2025 (NUTS 2024: Lisboa = 1A01106), substitui o 0008273, que parou em 2023.
      # Confirmado pela sonda de 6/10/2026 (data/clean/ine_probe.json): dim_3 sexo (T = HM), dim_4 grupo etário
      # (T = Total), 308 concelhos; 2021–2023 iguais aos do 0008273 (Lisboa 2023: 655 542).
      varcd: "0012917"
      description: População residente (N.º)
      level: municipality
      dims: {dim_3: "T", dim_4: "T"}
      optional: true
    # Agregados fiscais por escalão de rendimento bruto declarado (INE 0012742, anual 2018+, concelho; dim_3 T1..T6,
    # confirmado no snapshot bruto): para estimar que parte dos agregados do concelho consegue pagar uma renda.
    tax_households_1:
      varcd: "0012742"
      description: Agregados fiscais com rendimento bruto declarado de menos de 5 000 € (N.º)
      level: municipality
      dims: {dim_3: "T1"}
      optional: true
    tax_households_2:
      varcd: "0012742"
      description: Agregados fiscais com rendimento bruto declarado de 5 000 a 10 000 € (N.º)
      level: municipality
      dims: {dim_3: "T2"}
      optional: true
    tax_households_3:
      varcd: "0012742"
      description: Agregados fiscais com rendimento bruto declarado de 10 000 a 13 500 € (N.º)
      level: municipality
      dims: {dim_3: "T3"}
      optional: true
    tax_households_4:
      varcd: "0012742"
      description: Agregados fiscais com rendimento bruto declarado de 13 500 a 19 000 € (N.º)
      level: municipality
      dims: {dim_3: "T4"}
      optional: true
    tax_households_5:
      varcd: "0012742"
      description: Agregados fiscais com rendimento bruto declarado de 19 000 a 32 500 € (N.º)
      level: municipality
      dims: {dim_3: "T5"}
      optional: true
    tax_households_6:
      varcd: "0012742"
      description: Agregados fiscais com rendimento bruto declarado de 32 500 € ou mais (N.º)
      level: municipality
      dims: {dim_3: "T6"}
      optional: true
    # Não usados: 0012786 (Transações em €, só até NUTS II, sem número de vendas) e 0012748 (rendimento bruto
    # médio por sujeito passivo) — ver README.
    income:
      varcd: "0012653"         # Ganho médio mensal (€), por concelho, anual (MTSSS/GEP, Quadros de Pessoal)
      description: Ganho médio mensal dos trabalhadores por conta de outrem (€)
      level: municipality
      # dim_3: T = Total (confirmado com `imopt inspect 0012653`); restantes valores são níveis de
      # escolaridade (1..10) — ver dim_3_t na resposta.
      dims: {dim_3: "T"}
      period_kind: year
      optional: true
    # Contexto demográfico (por concelho): explica porque é que mercados pequenos saltam tanto em
    # percentagem. Títulos do catálogo do INE só mencionam a dimensão geográfica (sem categoria extra),
    # ao contrário do rendimento acima — por isso é provável que não precisem de `dims`, mas não foi
    # confirmado ao vivo (`imopt inspect <varcd>`) nesta sessão; falham alto e de forma não-fatal se
    # houver alguma dimensão inesperada.
    population_density:
      varcd: "0013189"          # Densidade populacional (N.º/km²), por concelho, anual
      description: Densidade populacional (N.º/km²)
      level: municipality
      period_kind: year
      optional: true
    ageing_index:
      varcd: "0012909"          # Índice de envelhecimento (idosos por 100 jovens), por concelho, anual
      description: Índice de envelhecimento (N.º)
      level: municipality
      period_kind: year
      optional: true
    migration_balance:
      varcd: "0013179"          # Saldo migratório (N.º), por concelho, anual
      description: Saldo migratório (N.º)
      level: municipality
      period_kind: year
      optional: true
    # Pressão turística e crédito (códigos do catálogo do INE; `dims` não confirmado ao vivo: se houver
    # dimensões extra, falha alto e de forma não-fatal com as opções no meta.json).
    tourism_nights:
      varcd: "0009183"          # Dormidas (N.º) nos estabelecimentos de alojamento turístico, município, anual
      description: Dormidas em alojamento turístico (N.º)
      level: municipality
      # dim_3 = país de residência dos hóspedes (PT, E = estrangeiro, ES, FR…); T = Total (confirmado no snapshot bruto).
      dims: {dim_3: "T"}
      period_kind: year
      optional: true
    housing_credit_pc:
      varcd: "0013048"          # Crédito à habitação por habitante (€), município, anual
      description: Crédito à habitação por habitante (€)
      level: municipality
      period_kind: year
      optional: true

macro:
  euribor_3m:
    url: https://data-api.ecb.europa.eu/service/data/FM/M.U2.EUR.RT.MM.EURIBOR3MD_.HSTA
    params: {format: csvdata}
    optional: true
  euribor_6m:
