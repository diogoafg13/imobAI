    params: {geo: PT, purchase: TOTAL, unit: I15_Q, format: JSON, lang: EN}
  eurostat_hicp:
    # IHPC (inflação) de Portugal, 2015=100, mensal. Serve para deflacionar o HPI (preço real).
    # Desde os dados de jan/2026 o Eurostat publica o IHPC na classificação ECOICOP ver. 2, num conjunto novo
    # (prc_hicp_minr, dimensão coicop18, total = TOTAL; série completa desde 1996, bases 2015 e 2025). O antigo
    # prc_hicp_midx (coicop CP00) ficou parado em dez/2025. Se faltar algum mês no fim, a série é prolongada com
    # a taxa de variação homóloga (não depende da base).
    url: https://ec.europa.eu/eurostat/api/dissemination/statistics/1.0/data/prc_hicp_minr
