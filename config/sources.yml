    params: {geo: [AT, BE, BG, CY, CZ, DE, DK, EE, EL, ES, FI, FR, HR, HU, IE, IT, LT, LU, LV, MT, NL, PL, PT, RO, SE, SI, SK], coicop18: TOTAL, unit: I15, format: JSON, lang: EN}
    units: [I15]
    rates:
      url: https://ec.europa.eu/eurostat/api/dissemination/statistics/1.0/data/prc_hicp_minr
      params: {geo: [AT, BE, BG, CY, CZ, DE, DK, EE, EL, ES, FI, FR, HR, HU, IE, IT, LT, LU, LV, MT, NL, PL, PT, RO, SE, SI, SK], coicop18: TOTAL, unit: RCH_A, format: JSON, lang: EN}
    optional: true
  bis_credit_gap:
    # BIS data portal (SDMX). Série: crédito ao sector privado não financeiro / PIB, desvio da tendência.
    url: https://stats.bis.org/api/v2/data/dataflow/BIS/WS_CREDIT_GAP/1.0/Q.PT.P.A.C
    params: {format: csv}
    optional: true

# Taxas de IMI por concelho: consulta pública da Autoridade Tributária ("Taxas IMI/CA por Município e Ano").
# O formulário dá os anos e os códigos dos distritos; a tabela, por ano e distrito, a taxa dos prédios urbanos, as
# taxas por freguesia e a dedução do IMI familiar. Só é descarregada quando sai um ano novo (ver imopt/imi.py).
imi:
  form_url: https://www.portaldasfinancas.gov.pt/pt/main.jsp
  form_params: {body: /imi/consultarTaxasIMIForm.jsp}
  table_url: https://www.portaldasfinancas.gov.pt/pt/main.jsp
  table_params: {body: /imi/consultarTaxasIMI.jsp}

# Alojamento local: Registo Nacional (RNAL), Turismo de Portugal, dados abertos (continente). Um registo por
# estabelecimento, com coordenadas; ligado à freguesia pelas fronteiras (ver imopt/al.py). Descarregado no máximo
# uma vez por semana.
al:
  urls:
    - https://dadosabertos.turismodeportugal.pt/api/download/v1/items/4e62eb1977564991bd01e61d7aa8266f/csv?layers=6

# Escolas, saúde e estações por freguesia: OpenStreetMap pela API Overpass (© contribuidores do OpenStreetMap, ODbL).
# Três consultas, no máximo uma vez por semana (ver imopt/osm.py).
osm:
  # API ohsome (HeiGIT; o país inteiro num pedido): desligada — a v1 recusou os runners do GitHub (403, 6/10/2026) e é
  # desligada a 30/11/2026; a v2 ainda não foi confirmada. O código fica pronto (osm.fetch_ohsome): basta pôr aqui
  # `ohsome: <url do endpoint de centroides>` quando houver um que responda.
  # servidores públicos da API Overpass (lista em wiki.openstreetmap.org/wiki/Overpass_API#Public_Overpass_API_instances),
  # tentados um a um quando um está ocupado (429/504)
  urls: [https://overpass-api.de/api/interpreter, https://overpass.private.coffee/api/interpreter,
         https://overpass.kumi.systems/api/interpreter, https://maps.mail.ru/osm/tools/overpass/api/interpreter]

# Descoberta (imopt/discover.py): guarda o catálogo do INE e a descrição de serviços de mapas no branch `data`, para
# confirmar códigos e camadas antes de os usar. Não mexe nos números do painel.
# Zonas inundáveis (imopt/flood.py): cartas da Diretiva 2007/60/CE, APA/SNIAmb, 2.º ciclo; camada 1 = "Limite"
# (área inundável), campo pretorno = período de retorno. Confirmado pela descrição do serviço guardada em
# data/raw/services/apa_inundacoes_1.json (6/10/2026). Só o continente, só as ARPSI.
flood:
  url: https://sniambgeoogc.apambiente.pt/getogc/rest/services/SNIAmb/Diretiva200760CE_2c/MapServer/1
  field: pretorno

discover:
  ine_ranges: ["0012400-0012700", "0013000-0013500", "0011600-0011800"]
  max_requests: 400
  # Códigos novos encontrados no catálogo completo (6/10/2026), sondados uma vez para confirmar as dimensões:
  # 0012917/0012918 População residente por concelho até 2025 (substitutos de 0008272/0008273, parados em 2023);
  # 0014765 Índice de preços da habitação base 2025, até 2026T2 (o 0009201, base 2015, parou em 2025T4);
  # Censos 2021 por freguesia: 0012575 índice de envelhecimento dos edifícios, 0012581 % de edifícios com
  # necessidade de reparação, 0012576/0012577/0012578/0012582/0014620/0014621 edifícios (N.º) por categorias
  # (a confirmar quais são época de construção e estado de conservação).
  # (todos sondados a 6/10/2026; ligados: 0012917 população, 0014765 HPI, 0012578 edifícios)
  # e para os terrenos: fogos licenciados em construções novas por freguesia (0000087 e 0000088, até 2025)
  # rendas por freguesia com a metodologia de 2026 (até 2025; o painel usa ainda a de 2021, que acaba em 2024)
  ine_probe: ["0014697", "0014698", "0014772", "0014773", "0000087", "0000088", "0012917", "0012918", "0014765", "0012575", "0012581", "0012576", "0012577", "0012578", "0012582",
              "0014620", "0014621"]
  # API OGC da DGT: Carta do Regime de Uso do Solo (CRUS, a planta de ordenamento dos PDM uniformizada: solo urbano/
  # rústico e categorias), uma coleção por concelho (ex.: crus_fafe); e RAN/REN, se lá estiverem.
  ogc:
    dgt:
      base: https://ogcapi.dgterritorio.gov.pt
      # confirmado a 7/10/2026: 90 coleções, CORS aberto (o site pode consultar do browser); a CRUS é uma só coleção
      # (`crus`), há cadastro predial e as servidões (srup_*). `point`: teste de consulta num ponto (Loures).
      sample: [crus, cadastro, srup_ran, srup_ren_areal, srup_areas_protegidas, srup_zec, srup_zpe, srup_perigosidade_inc_rural]
      grep: ["^crus", "cadastro", "srup_"]
      point: [-9.1685, 38.8309]
  services:
    apa_inundacoes: https://sniambgeoogc.apambiente.pt/getogc/rest/services/SNIAmb/Diretiva200760CE_2c/MapServer

geo:
  # Fronteiras dos concelhos (E-REDES / OpenDataSoft, licença aberta).
  municipalities_geojson: https://e-redes.opendatasoft.com/api/explore/v2.1/catalog/datasets/municipalities-portugal/exports/geojson
  # Fronteiras das freguesias. URLs tentados por ordem (o georef do OpenDataSoft foi confirmado no build
  # publicado); o primeiro que funcionar é guardado em data/clean/geo_parishes.json e reutilizado.
  # Também podes pôr lá um GeoJSON teu (ex.: CAOP da DGT convertido) com o código DICOFRE de 6 dígitos.
  parishes_geojson:
    - https://public.opendatasoft.com/api/explore/v2.1/catalog/datasets/georef-portugal-freguesia/exports/geojson
  parish_props: [fre_code, dicofre, DICOFRE, Dicofre, cod_freguesia, codigo, code]
  # Candidatos a propriedade com o código DICO (4 dígitos) e com o nome.
  dico_props: [con_code, dico, DICO, codigo, code, cod_concelho]
  name_props: [con_name, concelho, municipality, name, nome, dtmn]

listings:
  # Módulo opcional e DESLIGADO por omissão. Ver docs/listings.md.
  enabled: false
  respect_robots_txt: true
  min_delay_seconds: 5
